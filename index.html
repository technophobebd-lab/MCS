<!-- Inquiry & Order Form Section -->
<section style="margin-top: 40px; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    <h2>Request Custom Furniture / Inquiry</h2>
    <form id="inquiry-form">
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Your Name:</label>
            <input type="text" id="customer_name" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Email Address:</label>
            <input type="email" id="email" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Order Notes / Custom Requirements:</label>
            <textarea id="message" rows="4" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;"></textarea>
        </div>
        <button type="submit" style="background: #2c221e; color: #fff; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 1em;">Submit Inquiry</button>
    </form>
    <p id="form-status" style="margin-top: 15px; font-weight: bold;"></p>
</section>

<script type="module">
    import { supabase } from './supabase-config.js';

    const form = document.getElementById('inquiry-form');
    const statusP = document.getElementById('form-status');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const customer_name = document.getElementById('customer_name').value;
        const email = document.getElementById('email').value;
        const message = document.getElementById('message').value;

        statusP.style.color = '#333';
        statusP.innerText = 'Sending your inquiry...';

        // Insert form values into the Supabase 'inquiries' table
        const { error } = await supabase
            .from('inquiries')
            .insert([{ customer_name, email, message }]);

        if (error) {
            statusP.style.color = '#ff6b6b';
            statusP.innerText = 'Error submitting form: ' + error.message;
        } else {
            statusP.style.color = '#51cf66';
            statusP.innerText = 'Thank you! Your inquiry has been sent successfully.';
            form.reset();
        }
    });
</script>
